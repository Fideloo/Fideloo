<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="100%" height="36">
  <defs>
    <linearGradient id="divCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Accent Lines -->
  <line x1="20" y1="18" x2="250" y2="18" stroke="#1e293b" stroke-width="1" />
  <circle cx="250" cy="18" r="2" fill="#00f0ff" opacity="0.8" />

  <!-- Center Badge / Notification Pill -->
  <g transform="translate(450, 18)">
    <rect x="-195" y="-12" width="390" height="24" rx="12" fill="#0a0f1d" stroke="url(#divCyan)" stroke-width="1.2" filter="url(#divGlow)" />
    
    <!-- Butterfly icon mini -->
    <path d="M -175 -3 C -180 -8, -188 -4, -185 0 C -188 4, -180 8, -175 3 Z" fill="#38bdf8" />
    <path d="M -175 -3 C -170 -8, -162 -4, -165 0 C -162 4, -170 8, -175 3 Z" fill="#38bdf8" />

    <text x="0" y="3.5" text-anchor="middle" fill="#cbd5e1" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" letter-spacing="1">
      <tspan fill="#38bdf8">THIS ACTION WILL HAVE CONSEQUENCES</tspan> <tspan fill="#64748b">•</tspan> <tspan fill="#f59e0b">ENDURE &amp; SURVIVE</tspan>
    </text>

    <!-- Watch icon mini -->
    <circle cx="175" cy="0" r="4.5" fill="none" stroke="#f59e0b" stroke-width="1" />
    <line x1="175" y1="0" x2="177" y2="-2" stroke="#f59e0b" stroke-width="0.8" />
    <line x1="175" y1="0" x2="178" y2="0" stroke="#f59e0b" stroke-width="0.8" />
  </g>

  <!-- Right Accent Lines -->
  <circle cx="650" cy="18" r="2" fill="#f59e0b" opacity="0.8" />
  <line x1="650" y1="18" x2="880" y2="18" stroke="#1e293b" stroke-width="1" />
</svg>
