<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="butterflyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="butterflyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="watchBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="watchFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="70%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#e2d2ba" />
    </linearGradient>

    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543310" />
      <stop offset="50%" stop-color="#744210" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    /* Glitch Animation */
    @keyframes glitchText {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 1px); }
      40% { transform: translate(-1px, -1px); }
      60% { transform: translate(2px, 0); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    @keyframes glitchColor {
      0%, 92%, 100% { opacity: 0; transform: translate(0); }
      93% { opacity: 0.8; transform: translate(-3px, 1px); }
      95% { opacity: 0.9; transform: translate(3px, -1px); }
      97% { opacity: 0.7; transform: translate(-2px, 2px); }
    }

    @keyframes butterflyFloat {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(2px, -8px) rotate(-3deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes flapLeft {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.28); }
    }

    @keyframes flapRight {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.28); }
    }

    @keyframes timeParticles {
      0% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.9; transform: translateY(-10px) scale(1.1); }
      100% { opacity: 0.2; transform: translateY(0); }
    }

    @keyframes pulseAura {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }

    .butterfly-container {
      animation: butterflyFloat 4s ease-in-out infinite;
      transform-origin: 125px 90px;
    }

    .wing-left {
      transform-origin: 125px 90px;
      animation: flapLeft 0.5s ease-in-out infinite alternate;
    }

    .wing-right {
      transform-origin: 125px 90px;
      animation: flapRight 0.5s ease-in-out infinite alternate;
    }

    .glitch-base {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .glitch-cyan {
      fill: #00f0ff;
      animation: glitchColor 3.5s infinite linear;
    }

    .glitch-pink {
      fill: #ff007f;
      animation: glitchColor 3.5s infinite linear reverse;
    }

    .time-mote {
      animation: timeParticles 3s ease-in-out infinite;
    }
  </style>

  <!-- Banner Background -->
  <rect width="900" height="260" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="260" rx="14" fill="url(#cyberGrid)" />

  <!-- Cyberpunk Ambient Corner Glows -->
  <circle cx="90" cy="80" r="130" fill="#00f0ff" opacity="0.08" filter="url(#cyanGlow)" />
  <circle cx="810" cy="180" r="140" fill="#f59e0b" opacity="0.06" filter="url(#warmGlow)" />

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="898" height="258" rx="13" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
  <path d="M 0 35 L 0 14 Q 0 0 14 0 L 35 0" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8" />
  <path d="M 865 260 L 886 260 Q 900 260 900 246 L 900 225" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8" />
  <path d="M 900 35 L 900 14 Q 900 0 886 0 L 865 0" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6" />
  <path d="M 0 225 L 0 246 Q 0 260 14 260 L 35 260" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6" />

  <!-- ========================================== -->
  <!-- LEFT EASTER EGG: Life is Strange Butterfly -->
  <!-- ========================================== -->
  <g class="butterfly-container">
    <!-- Time Particles (Rewind Echoes) -->
    <circle cx="95" cy="65" r="2" fill="#38bdf8" class="time-mote" style="animation-delay: 0.2s;" />
    <circle cx="150" cy="55" r="1.5" fill="#7dd3fc" class="time-mote" style="animation-delay: 0.8s;" />
    <circle cx="85" cy="120" r="2.5" fill="#00f0ff" class="time-mote" style="animation-delay: 1.4s;" />
    <circle cx="160" cy="115" r="1.8" fill="#38bdf8" class="time-mote" style="animation-delay: 2.1s;" />

    <!-- Soft Aura behind Butterfly -->
    <ellipse cx="125" cy="90" rx="36" ry="30" fill="#0284c7" opacity="0.25" filter="url(#cyanGlow)" />

    <!-- Left Wings -->
    <g class="wing-left">
      <!-- Forewing Left -->
      <path d="M 125 90 C 110 50, 75 30, 68 52 C 60 74, 90 92, 125 93 Z" 
            fill="url(#butterflyGrad1)" stroke="#38bdf8" stroke-width="0.8" />
      <path d="M 125 90 C 115 62, 85 45, 78 58 C 72 73, 98 88, 125 92 Z" 
            fill="url(#butterflyGrad2)" opacity="0.8" />
      <circle cx="75" cy="55" r="1.5" fill="#ffffff" opacity="0.9" />
      <circle cx="85" cy="48" r="1" fill="#ffffff" opacity="0.8" />

      <!-- Hindwing Left -->
      <path d="M 125 93 C 105 95, 82 112, 92 128 C 102 140, 120 115, 125 96 Z" 
            fill="url(#butterflyGrad1)" stroke="#0284c7" stroke-width="0.8" />
      <path d="M 125 93 C 110 98, 92 114, 100 124 C 108 132, 120 112, 125 96 Z" 
            fill="url(#butterflyGrad2)" opacity="0.75" />
    </g>

    <!-- Right Wings -->
    <g class="wing-right">
      <!-- Forewing Right -->
      <path d="M 125 90 C 140 50, 175 30, 182 52 C 190 74, 160 92, 125 93 Z" 
            fill="url(#butterflyGrad1)" stroke="#38bdf8" stroke-width="0.8" />
      <path d="M 125 90 C 135 62, 165 45, 172 58 C 178 73, 152 88, 125 92 Z" 
            fill="url(#butterflyGrad2)" opacity="0.8" />
      <circle cx="175" cy="55" r="1.5" fill="#ffffff" opacity="0.9" />
      <circle cx="165" cy="48" r="1" fill="#ffffff" opacity="0.8" />

      <!-- Hindwing Right -->
      <path d="M 125 93 C 145 95, 168 112, 158 128 C 148 140, 130 115, 125 96 Z" 
            fill="url(#butterflyGrad1)" stroke="#0284c7" stroke-width="0.8" />
      <path d="M 125 93 C 140 98, 158 114, 150 124 C 142 132, 130 112, 125 96 Z" 
            fill="url(#butterflyGrad2)" opacity="0.75" />
    </g>

    <!-- Butterfly Body & Antennae -->
    <ellipse cx="125" cy="94" rx="2.5" ry="12" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5" />
    <path d="M 124 82 Q 118 70 112 72" fill="none" stroke="#7dd3fc" stroke-width="0.7" />
    <path d="M 126 82 Q 132 70 138 72" fill="none" stroke="#7dd3fc" stroke-width="0.7" />
  </g>

  <!-- Tagline underneath Butterfly -->
  <text x="125" y="162" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9" letter-spacing="1" opacity="0.85">
    [ REWIND // 🦋 ]
  </text>
  <text x="125" y="176" text-anchor="middle" fill="#64748b" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="0.5">
    consequences pending
  </text>


  <!-- ============================================== -->
  <!-- CENTER: Hero Title with Cyber Glitch & Details -->
  <!-- ============================================== -->
  <g transform="translate(450, 95)">
    <!-- Glitch duplicate layers -->
    <text class="glitch-base glitch-cyan" x="0" y="0" text-anchor="middle" font-size="34">
      Luiz Gustavo | Fidelo
    </text>
    <text class="glitch-base glitch-pink" x="0" y="0" text-anchor="middle" font-size="34">
      Luiz Gustavo | Fidelo
    </text>
    <!-- Main crisp title -->
    <text class="glitch-base" x="0" y="0" text-anchor="middle" font-size="34" fill="#ffffff">
      Luiz Gustavo <tspan fill="#00f0ff">|</tspan> <tspan fill="#38bdf8">Fidelo</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" letter-spacing="1.5">
      Full-Stack Developer <tspan fill="#00f0ff">•</tspan> Building Digital Experiences
    </text>

    <!-- Badges / System Status Line -->
    <g transform="translate(0, 60)">
      <!-- Cyber chip / HUD capsule -->
      <rect x="-190" y="0" width="380" height="26" rx="6" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <circle cx="-174" cy="13" r="3.5" fill="#10b981" />
      
      <text x="-162" y="17" fill="#64748b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">
        SYS_STATUS:
      </text>
      <text x="-85" y="17" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10">
        ONLINE
      </text>

      <text x="-25" y="17" fill="#475569" font-family="'Courier New', monospace" font-size="10">|</text>

      <text x="-10" y="17" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9.5">
        STORY_DRIVEN
      </text>

      <text x="75" y="17" fill="#475569" font-family="'Courier New', monospace" font-size="10">|</text>

      <text x="88" y="17" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9.5">
        AI &amp; FULLSTACK
      </text>
    </g>
  </g>


  <!-- ============================================== -->
  <!-- RIGHT EASTER EGG: Joel's Broken Watch (TLOU)    -->
  <!-- ============================================== -->
  <g transform="translate(775, 120)">
    <!-- Warm Hearth Glow -->
    <circle cx="0" cy="0" r="46" fill="#f59e0b" opacity="0.15" filter="url(#warmGlow)" />

    <!-- Leather Strap (Top & Bottom) -->
    <rect x="-14" y="-55" width="28" height="25" rx="3" fill="url(#strapGrad)" stroke="#271302" stroke-width="1" />
    <path d="M -11 -48 L -11 -35 M 11 -48 L 11 -35" stroke="#a16207" stroke-width="1" stroke-dasharray="2,2" opacity="0.7" />

    <rect x="-14" y="30" width="28" height="25" rx="3" fill="url(#strapGrad)" stroke="#271302" stroke-width="1" />
    <path d="M -11 35 L -11 48 M 11 35 L 11 48" stroke="#a16207" stroke-width="1" stroke-dasharray="2,2" opacity="0.7" />

    <!-- Crown / Knob -->
    <rect x="34" y="-5" width="6" height="10" rx="1.5" fill="#475569" stroke="#1e293b" stroke-width="0.8" />

    <!-- Watch Outer Casing & Bezel -->
    <circle cx="0" cy="0" r="36" fill="url(#watchBezel)" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="32" fill="#334155" />
    <circle cx="0" cy="0" r="30" fill="url(#watchFace)" />

    <!-- Dial Hour Markers -->
    <!-- 12, 3, 6, 9 -->
    <rect x="-1" y="-27" width="2" height="5" fill="#334155" rx="0.5" />
    <rect x="22" y="-1" width="5" height="2" fill="#334155" rx="0.5" />
    <rect x="-1" y="22" width="2" height="5" fill="#334155" rx="0.5" />
    <rect x="-27" y="-1" width="5" height="2" fill="#334155" rx="0.5" />
    <!-- Ticks -->
    <circle cx="14" cy="-21" r="1.2" fill="#64748b" />
    <circle cx="21" cy="-14" r="1.2" fill="#64748b" />
    <circle cx="21" cy="14" r="1.2" fill="#64748b" />
    <circle cx="14" cy="21" r="1.2" fill="#64748b" />
    <circle cx="-14" cy="21" r="1.2" fill="#64748b" />
    <circle cx="-21" cy="14" r="1.2" fill="#64748b" />
    <circle cx="-21" cy="-14" r="1.2" fill="#64748b" />
    <circle cx="-14" cy="-21" r="1.2" fill="#64748b" />

    <!-- Hands: Stopped at 2:15 (The Outbreak Moment) -->
    <!-- Center pin -->
    <circle cx="0" cy="0" r="2.5" fill="#1e293b" />
    <!-- Hour Hand pointing towards 2 o'clock (approx 60 deg) -->
    <line x1="0" y1="0" x2="11" y2="-7" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
    <!-- Minute Hand pointing towards 3 o'clock (approx 90 deg / 15 min) -->
    <line x1="0" y1="0" x2="18" y2="-1" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" />

    <!-- THE ICONIC CRACKED GLASS (The Last of Us signature) -->
    <!-- Main fracture running across the face -->
    <path d="M -18 20 L -6 8 L 2 12 L 8 -2 L 18 -12 L 24 -10" 
          fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9" />
    <path d="M -18 20 L -6 8 L 2 12 L 8 -2 L 18 -12 L 24 -10" 
          fill="none" stroke="#475569" stroke-width="0.6" opacity="0.5" />
    <!-- Branching cracks -->
    <path d="M 2 12 L 12 18 L 19 23" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <path d="M 8 -2 L 5 -16 L 9 -22" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.8" />
    <path d="M -6 8 L -12 2 L -22 -4" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75" />

    <!-- Glass reflection highlight -->
    <path d="M -22 -15 A 28 28 0 0 1 15 -22" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.35" stroke-linecap="round" />
  </g>

  <!-- Tagline underneath Watch -->
  <text x="775" y="198" text-anchor="middle" fill="#d4a373" font-family="'Courier New', monospace" font-size="9" letter-spacing="1" opacity="0.9">
    [ 2:15 // ⌚ ]
  </text>
  <text x="775" y="212" text-anchor="middle" fill="#64748b" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="0.5">
    endure and survive
  </text>

  <!-- Bottom Scanline Bar -->
  <rect x="20" y="246" width="860" height="2" fill="#1e293b" rx="1" />
  <rect x="20" y="246" width="220" height="2" fill="url(#neonCyan)" rx="1" opacity="0.8" />
</svg>
